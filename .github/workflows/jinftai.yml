name: Build bindfs for Android

on:
  # 允许手动触发
  workflow_dispatch:
  # 也可以 push 到 main 时自动编译
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true
          local-cache: true

      - name: Clone build automator
        run: |
          git clone --depth=1 https://github.com/agnostic-apollo/Android-NDK-Cross-Compile-Build-Automator.git automator

      - name: Clone fuse & bindfs (Android ports)
        run: |
          git clone --depth=1 https://github.com/agnostic-apollo/fuse.git automator/projects/fuse
          git clone --depth=1 https://github.com/agnostic-apollo/bindfs.git automator/projects/bindfs

      - name: Copy post-build scripts
        run: |
          mkdir -p automator/post_build_scripts
          cp automator/projects/fuse/post_build_scripts/fusermount_extractor.sh automator/post_build_scripts/ || true
          cp automator/projects/bindfs/post_build_scripts/bindfs_extractor.sh automator/post_build_scripts/ || true

      - name: Configure automator
        working-directory: automator
        env:
          NDK_PATH: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          # 设置要编译的项目
          sed -i 's/^PROJECTS_TO_BUILD=.*/PROJECTS_TO_BUILD="fuse bindfs"/' android_ndk_cross_compile_build_automator.sh
          
          # 设置编译后提取脚本
          sed -i 's/^POST_BUILD_SCRIPTS_TO_RUN=.*/POST_BUILD_SCRIPTS_TO_RUN="fusermount_extractor.sh bindfs_extractor.sh"/' android_ndk_cross_compile_build_automator.sh
          
          # 设置目标架构（按需增删）
          sed -i 's/^ARCHS_SRC_TO_BUILD=.*/ARCHS_SRC_TO_BUILD="arm64-v8a armeabi-v7a x86 x86_64"/' android_ndk_cross_compile_build_automator.sh
          
          # 指向 NDK 路径
          sed -i "s|^ANDROID_NDK_ROOT=.*|ANDROID_NDK_ROOT=${NDK_PATH}|" android_ndk_cross_compile_build_automator.sh
          
          echo "=== Config check ==="
          grep -E '^(PROJECTS_TO_BUILD|POST_BUILD_SCRIPTS_TO_RUN|ARCHS_SRC_TO_BUILD|ANDROID_NDK_ROOT)=' android_ndk_cross_compile_build_automator.sh

      - name: Build fuse & bindfs
        working-directory: automator
        run: bash ./android_ndk_cross_compile_build_automator.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindfs-android-binaries
          path: |
            automator/out/
            automator/install/
