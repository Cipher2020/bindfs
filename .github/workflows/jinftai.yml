name: Build mpartel/bindfs Android arm64-v8a

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config gettext libtinfo6

      - name: Fix NDK clang libtinfo dependency (Ubuntu 24.04)
        run: |
          sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5

      - name: Download Android NDK r25c
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "NDK_PATH=$PWD/android-ndk-r25c" >> $GITHUB_ENV

      - name: Verify NDK compiler
        run: |
          export TOOLCHAIN=$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64
          $TOOLCHAIN/bin/aarch64-linux-android21-clang --version
          echo 'int main(){return 0;}' > /tmp/test.c
          $TOOLCHAIN/bin/aarch64-linux-android21-clang /tmp/test.c -o /tmp/test
          file /tmp/test

      - name: Clone sources
        run: |
          git clone --depth=1 https://github.com/mpartel/bindfs.git
          git clone --depth=1 https://github.com/agnostic-apollo/fuse.git

      - name: Build fuse (static library)
        env:
          NDK: ${{ env.NDK_PATH }}
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=21
          export SYSROOT=$TOOLCHAIN/sysroot
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          unset LD
          
          cd fuse
          ./makeconf.sh
          ./configure \
            --host=$TARGET \
            --with-sysroot=$SYSROOT \
            --enable-example=no \
            --disable-mtab \
            --enable-android=yes \
            --enable-static=yes \
            2>&1 || (echo "=== CONFIG.LOG ===" && cat config.log | tail -n 100 && exit 1)
          
          make -j$(nproc)
          make DESTDIR=$PWD/install install

      - name: Patch userinfo.c for Android
        run: |
          cd bindfs/src
          
          # 【关键】在 userinfo.c 里插入 Android 缺失函数的 stub
          # 不要替换整个文件，只添加 bionic 不支持的函数
          sed -i '/^#include "userinfo.h"/a\
          \
          #if defined(__ANDROID__)\
          static struct group* getgrent(void) { return 0; }\
          static struct passwd* getpwent(void) { return 0; }\
          static void setgrent(void) {}\
          static void endgrent(void) {}\
          static void endpwent(void) {}\
          static int getgrgid_r(gid_t gid, struct group * grp, char * buf, size_t buflen, struct group ** result) { *result = 0; return 0; }\
          static int getgrnam_r(const char * name, struct group * grp, char * buf, size_t buflen, struct group ** result) { *result = 0; return 0; }\
          #endif' userinfo.c
          
          echo "=== Patched userinfo.c (first 30 lines) ==="
          head -n 30 userinfo.c

      - name: Build bindfs
        env:
          NDK: ${{ env.NDK_PATH }}
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=21
          export SYSROOT=$TOOLCHAIN/sysroot
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          unset LD
          
          export FUSE_INSTALL=$PWD/fuse/install/usr/local
          export PKG_CONFIG_PATH=$FUSE_INSTALL/lib/pkgconfig:$PKG_CONFIG_PATH
          
          cd bindfs
          
          ./autogen.sh
          
          export CPPFLAGS="-D __ANDROID__"
          export CFLAGS="-static -I$FUSE_INSTALL/include -I$FUSE_INSTALL/include/fuse"
          export LDFLAGS="-static -static-libgcc -L$FUSE_INSTALL/lib"
          
          ./configure \
            --host=$TARGET \
            --with-sysroot=$SYSROOT \
            --enable-static=yes \
            2>&1 || (echo "=== CONFIG.LOG ===" && cat config.log | tail -n 100 && exit 1)
          
          make -j$(nproc)
          make DESTDIR=$PWD/install install
          
          $STRIP install/bin/bindfs 2>/dev/null || $STRIP install/usr/local/bin/bindfs 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindfs-arm64-v8a
          path: |
            bindfs/install/
            fuse/install/
