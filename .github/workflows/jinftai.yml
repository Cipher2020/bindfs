name: Build bindfs Android arm64-v8a

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config gettext

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true
          local-cache: true

      - name: Clone fuse & bindfs (Android ports)
        run: |
          git clone --depth=1 https://github.com/agnostic-apollo/fuse.git
          git clone --depth=1 https://github.com/agnostic-apollo/bindfs.git

      - name: Build fuse (static library)
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=21
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          cd fuse
          ./makeconf.sh
          ./configure \
            --host=$TARGET \
            --prefix=$PWD/install \
            --disable-shared \
            --enable-static \
            --disable-example \
            --disable-mtab
          
          make -j$(nproc)
          make install

      - name: Build bindfs (static binary)
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=21
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          export LD=$TOOLCHAIN/bin/ld
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          export PKG_CONFIG_PATH=$PWD/fuse/install/lib/pkgconfig:$PKG_CONFIG_PATH
          export CFLAGS="-I$PWD/fuse/install/include"
          export LDFLAGS="-L$PWD/fuse/install/lib"
          
          cd bindfs
          ./autogen.sh
          ./configure \
            --host=$TARGET \
            --prefix=$PWD/install \
            --disable-shared \
            --enable-static
          
          make -j$(nproc)
          make install
          
          $STRIP install/bin/bindfs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindfs-arm64-v8a-static
          path: |
            bindfs/install/bin/bindfs
            fuse/install/bin/fusermount
            fuse/install/bin/fusermount3
