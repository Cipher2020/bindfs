name: Build mpartel/bindfs Android arm64-v8a

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config gettext

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true
          local-cache: true

      - name: Clone sources
        run: |
          # 1. 原版 bindfs（你要跟进的最新版）
          git clone --depth=1 https://github.com/mpartel/bindfs.git
          # 2. Android 适配 patch 仓库（主要用来取 userinfo.c）
          git clone --depth=1 https://github.com/agnostic-apollo/bindfs.git bindfs-android
          # 3. Android 适配版 fuse 2.x（已知可交叉编译）
          git clone --depth=1 https://github.com/agnostic-apollo/fuse.git

      - name: Build fuse 2.x static library
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=21
          export SYSROOT=$TOOLCHAIN/sysroot
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          export CFLAGS="--sysroot=$SYSROOT"
          export LDFLAGS="--sysroot=$SYSROOT"
          export LD=$CC
          
          cd fuse
          ./makeconf.sh
          ./configure \
            --host=$TARGET \
            --prefix=$PWD/install \
            --disable-shared \
            --enable-static \
            --disable-example \
            --disable-mtab
          
          make -j$(nproc)
          make install

      - name: Build bindfs (with Android userinfo.c patch)
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=21
          export SYSROOT=$TOOLCHAIN/sysroot
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          export PKG_CONFIG_PATH=$PWD/fuse/install/lib/pkgconfig:$PKG_CONFIG_PATH
          export CFLAGS="--sysroot=$SYSROOT -I$PWD/fuse/install/include"
          export LDFLAGS="--sysroot=$SYSROOT -L$PWD/fuse/install/lib"
          export LD=$CC
          
          cd bindfs
          
          # 【关键】用 Android 适配版的 userinfo.c 替换原版
          # 解决 bionic 没有 getpwent/setpwent/endpwent 的问题
          cp ../bindfs-android/src/userinfo.c src/userinfo.c
          
          ./autogen.sh
          ./configure \
            --host=$TARGET \
            --prefix=$PWD/install \
            --disable-shared \
            --enable-static
          
          make -j$(nproc)
          make install
          
          $STRIP install/bin/bindfs

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindfs-arm64-v8a
          path: |
            bindfs/install/bin/bindfs
            fuse/install/bin/fusermount
