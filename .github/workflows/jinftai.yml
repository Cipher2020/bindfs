name: Build mpartel/bindfs Android arm64-v8a

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config gettext

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true
          local-cache: true

      - name: Clone sources
        run: |
          git clone --depth=1 https://github.com/mpartel/bindfs.git
          git clone --depth=1 https://github.com/agnostic-apollo/bindfs.git bindfs-android
          git clone --depth=1 https://github.com/agnostic-apollo/fuse.git

      - name: Build fuse (static library)
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=21
          export SYSROOT=$TOOLCHAIN/sysroot
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          # 关键：不要覆盖 LD，让 configure 自己找链接器
          unset LD
          
          cd fuse
          ./makeconf.sh
          ./configure \
            --host=$TARGET \
            --with-sysroot=$SYSROOT \
            --enable-example=no \
            --disable-mtab \
            --enable-android=yes \
            --enable-static=yes
          
          make -j$(nproc)
          # 用 DESTDIR 安装，保持和 automator 一致的目录结构
          make DESTDIR=$PWD/install install

      - name: Build bindfs (with Android userinfo.c patch)
        env:
          NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          export TOOLCHAIN=$NDK/toolchains/llvm/prebuilt/linux-x86_64
          export TARGET=aarch64-linux-android
          export API=21
          export SYSROOT=$TOOLCHAIN/sysroot
          
          export AR=$TOOLCHAIN/bin/llvm-ar
          export CC=$TOOLCHAIN/bin/$TARGET$API-clang
          export CXX=$TOOLCHAIN/bin/$TARGET$API-clang++
          export RANLIB=$TOOLCHAIN/bin/llvm-ranlib
          export STRIP=$TOOLCHAIN/bin/llvm-strip
          
          unset LD
          
          # fuse 安装后实际路径是 install/usr/local/...
          export FUSE_INSTALL=$PWD/fuse/install/usr/local
          export PKG_CONFIG_PATH=$FUSE_INSTALL/lib/pkgconfig:$PKG_CONFIG_PATH
          
          cd bindfs
          
          # 替换 Android 不兼容的 userinfo.c
          cp ../bindfs-android/src/userinfo.c src/userinfo.c
          
          ./autogen.sh
          
          # 参照 agnostic-apollo 构建脚本设置 flags
          export CPPFLAGS="-D __ANDROID__"
          export CFLAGS="-static -I$FUSE_INSTALL/include -I$FUSE_INSTALL/include/fuse"
          export LDFLAGS="-static -static-libgcc -L$FUSE_INSTALL/lib"
          
          ./configure \
            --host=$TARGET \
            --with-sysroot=$SYSROOT \
            --enable-static=yes
          
          make -j$(nproc)
          make DESTDIR=$PWD/install install
          
          # strip 减小体积（路径兼容两种可能）
          $STRIP install/bin/bindfs 2>/dev/null || $STRIP install/usr/local/bin/bindfs 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bindfs-arm64-v8a
          path: |
            bindfs/install/
            fuse/install/
